<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Selection Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f2f1;
            color: #323130;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #201f1e;
        }
        p {
            font-size: 16px;
            color: #605e5c;
            margin-bottom: 32px;
        }
        .btn {
            display: block;
            background-color: #0078d4;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 4px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #106ebe;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background-color: #107c41; /* Excel/Forms green accent alternative */
        }
        .btn-secondary:hover {
            background-color: #0b5930;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Form Selection Portal</h1>
    <p>Please select the appropriate form you need to complete below:</p>
    
    <!-- REPLACE THE '#' WITH YOUR ACTUAL MICROSOFT FORMS LINKS -->
    <a href="#" class="btn" target="_blank">Open Form Option 1</a>
    <a href="#" class="btn btn-secondary" target="_blank">Open Form Option 2</a>
</div>

</body>
</html>
